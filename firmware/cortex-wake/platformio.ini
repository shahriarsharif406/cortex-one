; Cortex Wake firmware (ESP32 dev board, Arduino framework).
; Compiles with PlatformIO for esp32dev (build only, 2026-10-18; also with -DLIGHT_SENSOR_FITTED).
; NEVER FLASHED, no board was available: treat the first run as untested. See BUILD_GUIDE_BN.md and PROTOCOL.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; -DLIGHT_SENSOR_FITTED  ; uncomment when a photoresistor/phototransistor divider aimed at the power LED is wired to GPIO 35 (use only ONE of the two sensors)
    ; -DSENSOR_FITTED        ; uncomment when the 5 V sense divider is wired to GPIO 34
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    madhephaestus/ESP32Servo@^3.0.5
