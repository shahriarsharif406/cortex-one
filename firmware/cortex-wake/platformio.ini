; Cortex Wake firmware (ESP32 dev board, Arduino framework).
; NOT COMPILED OR FLASHED by the author: no PlatformIO / arduino-cli was installed and no board
; was available. Treat the first build as untested. See BUILD_GUIDE_BN.md and PROTOCOL.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; -DSENSOR_FITTED        ; uncomment when the 5 V sense divider is wired to GPIO 34
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    madhephaestus/ESP32Servo@^3.0.5
